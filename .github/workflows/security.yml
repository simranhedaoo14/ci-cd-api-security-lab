name: Security Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  semgrep:
      name: SAST - Semgrep
      runs-on: ubuntu-latest

      container:
        image: semgrep/semgrep

      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Run Semgrep
          run: |
            semgrep scan \
              --config p/javascript \
              --error \
              --exclude node_modules/

  trivy:
    name: Dependency Scan - Trivy
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  zap:
    name: DAST - OWASP ZAP
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start API
        run: |
          export JWT_SECRET="$(openssl rand -hex 32)"
          nohup node server.js > server.log 2>&1 &
          sleep 5
          cat server.log
          curl --fail http://127.0.0.1:3000/health

      - name: Run OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://127.0.0.1:3000'
          allow_issue_writing: false
          fail_action: false

  security-gate:
    name: Security Gate
    runs-on: ubuntu-24.04

    needs:
      - gitleaks
      - semgrep
      - trivy
      - zap

    if: ${{ always() }}

    steps:
      - name: Evaluate security checks
        run: |
          echo "Gitleaks: ${{ needs.gitleaks.result }}"
          echo "Semgrep:  ${{ needs.semgrep.result }}"
          echo "Trivy:    ${{ needs.trivy.result }}"
          echo "ZAP:      ${{ needs.zap.result }}"

          if [ "${{ needs.gitleaks.result }}" != "success" ] || \
             [ "${{ needs.semgrep.result }}" != "success" ] || \
             [ "${{ needs.trivy.result }}" != "success" ] || \
             [ "${{ needs.zap.result }}" != "success" ]; then
            echo "❌ Security Gate FAILED"
            exit 1
          fi

          echo "✅ Security Gate PASSED"